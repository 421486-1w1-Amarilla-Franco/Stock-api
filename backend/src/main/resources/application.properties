# ========================
# Base de datos PostgreSQL
# ========================
spring.datasource.url=${DATABASE_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

# ========================
# JPA / Hibernate
# ========================
spring.jpa.hibernate.ddl-auto=validate

# ========================
# Flyway (migraciones en db/migration)
# baseline-version=0: en una base creada antes por Hibernate, V1 corre igual (es idempotente)
# ========================
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.jpa.show-sql=false
# Carga colecciones lazy (detalles de venta) de a lotes: evita N+1 en listados paginados
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ========================
# JWT
# ========================
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# ========================
# Swagger
# ========================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs

# ========================
# Server
# ========================
server.port=${PORT:8080}
spring.application.name=stock-api
